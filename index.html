<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chained to the Sun</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(160deg, #c9dff5 0%, #a8c8e8 40%, #daeaf7 100%);
    position: relative;
  }

  #scene {
    position: relative;
    width: 100%;
    height: 100%;
  }

  #figure {
    position: absolute;
    bottom: 8%;
    left: 12%;
    height: 72vh;
    max-height: 600px;
    z-index: 10;
    filter: drop-shadow(4px 8px 20px rgba(0,0,0,0.15));
    user-select: none;
    pointer-events: none;
  }

  #chain-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    pointer-events: none;
  }

  #sun-cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
  }

  #sun-cursor img {
    width: 100%;
    height: 100%;
    /* sun.png has black bg — use screen blend to make black transparent */
    mix-blend-mode: screen;
    filter: drop-shadow(0 0 18px rgba(255,240,120,0.85));
    animation: glowPulse 2s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 18px rgba(255,240,120,0.85)) brightness(1); }
    50% { filter: drop-shadow(0 0 32px rgba(255,240,120,1)) brightness(1.15); }
  }

  #hint {
    position: absolute;
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(60, 90, 130, 0.65);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 20;
    font-family: Georgia, serif;
    text-shadow: 0 1px 3px rgba(255,255,255,0.7);
  }
</style>
</head>
